<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>최돈희 | 자기소개</title>
  <!-- Pretendard는 Google Fonts에 없어 공식 jsDelivr CDN으로 로드 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <style>
    :root {
      --bg-from: #F8FAFC;
      --bg-to: #E0F2FE;
      --accent: #0EA5E9;
      --accent-soft: rgba(14, 165, 233, 0.10);
      --text: #1E293B;
      --text-muted: #64748B;
      --card-bg: rgba(255, 255, 255, 0.6);
      --card-border: rgba(255, 255, 255, 0.8);
      --line: rgba(148, 163, 184, 0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg-from) 0%, var(--bg-to) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* 배경의 은은한 빛 번짐 — glass 효과가 드러나도록 */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      pointer-events: none;
    }
    body::before {
      width: 420px; height: 420px;
      top: -120px; left: -100px;
      background: rgba(14, 165, 233, 0.18);
    }
    body::after {
      width: 360px; height: 360px;
      bottom: -120px; right: -80px;
      background: rgba(56, 189, 248, 0.16);
    }

    /* 떠다니는 점 — 카드 뒤 배경 레이어 */
    .dots {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .dot {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: var(--color);
      opacity: var(--alpha);
      animation: drift var(--dur) ease-in-out var(--delay) infinite;
      will-change: transform;
    }

    @keyframes drift {
      0%, 100% { transform: translate3d(0, 0, 0); }
      33%      { transform: translate3d(var(--dx1), var(--dy1), 0); }
      66%      { transform: translate3d(var(--dx2), var(--dy2), 0); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 48px 40px 40px;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      box-shadow:
        0 1px 2px rgba(15, 23, 42, 0.04),
        0 12px 32px -8px rgba(15, 23, 42, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow:
        0 2px 4px rgba(15, 23, 42, 0.04),
        0 24px 48px -12px rgba(14, 165, 233, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      background: linear-gradient(135deg, #38BDF8 0%, var(--accent) 60%, #0284C7 100%);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.9), 0 8px 24px -6px rgba(14, 165, 233, 0.5);
      user-select: none;
    }

    .name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.3;
    }

    .bio {
      margin-top: 8px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      word-break: keep-all;
    }

    .tags {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }

    .tags li {
      list-style: none;
    }
    .tags li::marker { content: none; }

    /* 카드 호버 시 태그가 왼쪽부터 차례로 떠오르는 stagger
       — 마우스가 있는 기기에서만 적용 (터치 기기에선 태그가 항상 선명하게 보임) */
    @media (hover: hover) and (prefers-reduced-motion: no-preference) {
      .tags li {
        opacity: 0.55;
        transform: translateY(6px);
        transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .card:hover .tags li {
        opacity: 1;
        transform: translateY(-2px);
        transition-delay: calc(var(--i) * 80ms);
      }
    }

    .tag {
      display: inline-block;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(14, 165, 233, 0.2);
      border-radius: 999px;
      cursor: default;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
    }

    .tag:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      transform: translateY(-1px);
    }

    .divider {
      height: 1px;
      margin: 28px 0 24px;
      background: linear-gradient(90deg, transparent, var(--line), transparent);
      border: 0;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .social {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
    }

    .social svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .social:hover {
      color: var(--accent);
      border-color: rgba(14, 165, 233, 0.4);
      box-shadow: 0 6px 16px -6px rgba(14, 165, 233, 0.35);
      transform: translateY(-1px);
    }

    .social:focus-visible,
    .tag:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* 모바일 (488px 이하) */
    @media (max-width: 488px) {
      body { padding: 16px; }

      .card {
        padding: 36px 24px 28px;
        border-radius: 20px;
      }

      .avatar {
        width: 76px;
        height: 76px;
        font-size: 28px;
      }

      .name { font-size: 24px; }
      .bio { font-size: 14px; }

      .socials {
        flex-direction: column;
      }

      .social { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      .dot { animation: none; }
    }
  </style>
</head>
<body>
  <div class="dots" aria-hidden="true"></div>

  <main class="card">
    <div class="avatar" aria-hidden="true">DH</div>

    <h1 class="name">최돈희</h1>
    <p class="bio">코드와 커피, 책과 산책을 좋아합니다.</p>

    <ul class="tags" aria-label="관심사">
      <li style="--i: 0"><span class="tag">창업</span></li>
      <li style="--i: 1"><span class="tag">여행</span></li>
      <li style="--i: 2"><span class="tag">커피</span></li>
      <li style="--i: 3"><span class="tag">강사</span></li>
    </ul>

    <hr class="divider" />

    <nav class="socials" aria-label="소셜 링크">
      <a class="social" href="https://github.com/dooniechoi" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1-.02-1.96-3.2.7-3.87-1.54-3.87-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.26 5.68.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
        </svg>
        GitHub
      </a>
      <a class="social" href="https://www.linkedin.com/in/donniech/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/>
        </svg>
        LinkedIn
      </a>
    </nav>
  </main>

  <script>
    // 스카이블루 계열의 작은 점 30개를 무작위 위치·크기·속도로 생성
    (function () {
      const COUNT = 30;
      const colors = ["#0EA5E9", "#38BDF8", "#7DD3FC", "#0284C7"];
      const rand = (min, max) => Math.random() * (max - min) + min;
      const layer = document.querySelector(".dots");
      const frag = document.createDocumentFragment();

      for (let i = 0; i < COUNT; i++) {
        const dot = document.createElement("span");
        dot.className = "dot";
        const dur = rand(16, 32);
        const vars = {
          "--x": rand(0, 100) + "%",
          "--y": rand(0, 100) + "%",
          "--size": rand(3, 8).toFixed(1) + "px",
          "--color": colors[i % colors.length],
          "--alpha": rand(0.2, 0.5).toFixed(2),
          "--dur": dur.toFixed(1) + "s",
          "--delay": (-rand(0, dur)).toFixed(1) + "s", // 음수 지연 → 처음부터 제각각 다른 위치에서 움직임
          "--dx1": rand(-60, 60).toFixed(0) + "px",
          "--dy1": rand(-60, 60).toFixed(0) + "px",
          "--dx2": rand(-60, 60).toFixed(0) + "px",
          "--dy2": rand(-60, 60).toFixed(0) + "px",
        };
        for (const k in vars) dot.style.setProperty(k, vars[k]);
        frag.appendChild(dot);
      }
      layer.appendChild(frag);
    })();
  </script>
</body>
</html>
